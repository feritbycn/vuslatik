name: iOS (IPA / TestFlight)

on:
  workflow_dispatch:
    inputs:
      surum_adi:
        description: "Sürüm adı (örn. 1.0.0)"
        default: "1.0.0"
      testflight:
        description: "Derlemeyi TestFlight'a yükle"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobil
    env:
      BUNDLE_ID: com.bilge360.ik
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobil/package-lock.json

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bağımlılıklar
        run: npm ci

      - name: Firebase yapılandırması (GoogleService-Info.plist)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -z "$PLIST_B64" ]; then echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 yok — anlık bildirim çalışmaz"; else echo "$PLIST_B64" | base64 -d > ios/App/App/GoogleService-Info.plist; fi

      - name: Capacitor senkronu + Pod kurulumu
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: İmza sertifikası ve profil
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_B64 }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ]; then echo "::error::IOS_CERT_P12_B64 ve IOS_PROVISION_PROFILE_B64 secret'ları gerekli (REHBER.md)"; exit 1; fi
          KC="$RUNNER_TEMP/build.keychain"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "ci" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "ci" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "ci" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profil.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision")")
          PNAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision")")
          cp "$RUNNER_TEMP/profil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFIL_ADI=$PNAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Archive
        env:
          VERSION_NAME: ${{ github.event.inputs.surum_adi }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL_ADI" CODE_SIGN_IDENTITY="Apple Distribution"

      - name: IPA dışa aktar
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFIL_ADI</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$GITHUB_WORKSPACE/cikti"
          ls -la "$GITHUB_WORKSPACE/cikti"

      - name: TestFlight'a yükle
        if: ${{ github.event.inputs.testflight == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f "$GITHUB_WORKSPACE"/cikti/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: bilge360-ik-ios
          path: cikti/*.ipa
          if-no-files-found: error
