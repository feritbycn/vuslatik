name: Android (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      surum_adi:
        description: "Sürüm adı (örn. 1.0.0)"
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobil/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK lisansları (SDK runner'da hazır gelir)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Bağımlılıklar
        run: npm ci

      - name: Firebase yapılandırması (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then echo "::warning::GOOGLE_SERVICES_JSON_B64 yok — uygulama derlenir ama anlık bildirim çalışmaz"; else printf %s "$GOOGLE_SERVICES_JSON_B64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/gs.raw" && python3 - "$RUNNER_TEMP/gs.raw" android/app/google-services.json <<'PY'
          import sys, json, codecs
          b = open(sys.argv[1], 'rb').read()
          if b.startswith(codecs.BOM_UTF16_LE) or b.startswith(codecs.BOM_UTF16_BE) or b'\x00' in b[:8]:
              t = b.decode('utf-16')
          else:
              t = b.decode('utf-8-sig')
          t = t.lstrip('\ufeff')
          try:
              json.loads(t)
          except Exception as e:
              print('::error::google-services.json çözülemedi (' + str(e) + '); ilk baytlar: ' + repr(b[:12]))
              sys.exit(1)
          open(sys.argv[2], 'w', encoding='utf-8').write(t)
          print('google-services.json hazır (' + str(len(t)) + ' karakter)')
          PY
          fi

      - name: Capacitor senkronu
        run: npx cap sync android

      - name: İmza anahtarını hazırla
        id: imza
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf %s "$KEYSTORE_B64" | tr -d ' \r\n\t"' | LC_ALL=C grep -o 'MIIK[A-Za-z0-9+/=]*' | head -1 | tr -d '\n' > "$RUNNER_TEMP/ks.b64"
            echo "Keystore secret uzunluğu: $(wc -c < "$RUNNER_TEMP/ks.b64") (beklenen 3516), geçersiz karakter sayısı: $(tr -d 'A-Za-z0-9+/=' < "$RUNNER_TEMP/ks.b64" | wc -c)"
            base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/release.jks" || { echo "::error::ANDROID_KEYSTORE_B64 geçersiz: uzunluk ve karakterler yukarıda"; exit 1; }
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "imzali=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 yok — AAB/APK imzasız üretilir (Google Play'e yüklenemez)"
            echo "imzali=0" >> "$GITHUB_OUTPUT"
          fi

      - name: AAB + APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.surum_adi || github.ref_name }}
        working-directory: mobil/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug

      - name: Çıktıları topla
        run: |
          mkdir -p ../cikti
          cp android/app/build/outputs/bundle/release/*.aab ../cikti/ 2>/dev/null || true
          if [ "${{ steps.imza.outputs.imzali }}" = "1" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ../cikti/bilge360-ik-release.apk
          else
            echo "::warning::Anahtar yok: kurulabilir TEST apk (debug imzalı) üretildi; Play Store için ANDROID_KEYSTORE_* secret'larını ekleyin"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk ../cikti/bilge360-ik-test-kurulabilir.apk
          ls -la ../cikti

      - uses: actions/upload-artifact@v4
        with:
          name: bilge360-ik-android
          path: cikti/*
          if-no-files-found: error
