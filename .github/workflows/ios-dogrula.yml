name: iOS derleme doğrulaması (imzasız)

on:
  push:
    paths: ["mobil/**", ".github/workflows/ios-dogrula.yml"]
  workflow_dispatch:

jobs:
  derle:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobil/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx cap sync ios
      - run: cd ios/App && pod install
      - name: Simülatör için derle (imza gerekmez)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
